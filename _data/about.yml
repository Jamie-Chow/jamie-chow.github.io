    period_zh: "2023.09 至今"
    en: >-
      **Ph.D. Candidate** in Management Science and Engineering,
      University of Chinese Academy of Sciences /
      Institutes of Science and Development, CAS.
      Advisor: [Prof. Jian-Feng Guo](https://people.ucas.ac.cn/~Guojf).
    zh: >-
      **博士研究生**，管理科学与工程专业，
      中国科学院大学 /
      中国科学院科技战略咨询研究院。
      导师：[郭剑锋研究员](https://people.ucas.ac.cn/~Guojf)。
  - period: "2019.09 – 2023.06"
    period_zh: "2019.09 – 2023.06"
    en: >-
      **Bachelor of Management** in Financial Management (Accounting),
      School of Economics and Management, China University of Petroleum, Beijing.
    zh: >-
      **管理学学士**，财务管理（会计）专业，
      中国石油大学（北京）经济管理学院。

hobbies:
  - name_en: "Swimming"
    name_zh: "游泳"
    en: "All four competitive strokes: freestyle, breaststroke, backstroke, and butterfly."
    zh: "掌握全部四种竞技泳姿：自由泳、蛙泳、仰泳与蝶泳。"
  - name_en: "Reading & History"
    name_zh: "阅读与历史"
    en: "Extensive reading in ancient Chinese history and the history of the Chinese Communist Party; see [my Goodreads profile](https://www.goodreads.com/user/show/203794463-jia-yi)."
    zh: "广泛阅读中国古代史、中国共产党历史相关书籍；详见[我的 Goodreads 主页](https://www.goodreads.com/user/show/203794463-jia-yi)。"
  - name_en: "OpenGov: Mapping China's Institutions"
    name_zh: "OpenGov：中国机构图谱"
    en: >-
      I am building OpenGov, a project similar in concept to WorldMonitor,
      focused on China's institutions and public affairs. I map central and
      local institutions, including party and government bodies, the military,
      state-owned enterprises, civic organizations, universities, and hospitals,
      and link them to their leaders, policies, and public finance records.
    zh: "我正在构建 OpenGov，一个类似 WorldMonitor、聚焦中国机构与公共事务的项目。我梳理从中央到地方的机构设置，将党政机关、军队、央企、社会组织、高校和医院与其主要负责人、相关政策及财政收支记录联系起来。"
  - name_en: "GIS & Satellite Imagery"
    name_zh: "GIS 与卫星影像"
    en: "I am building a dataset of land-use areas of interest (AOIs) in Beijing."
    zh: "我正在构建北京市用地 AOI（兴趣区域）数据集。"
  - name_en: "Online University"
    name_zh: "网络大学"
    en: >-
      I am building an online university and writing the textbooks and teaching
      materials for 100 courses with help from AI. I plan to deploy the platform
      on a blockchain and issue certificates of learning there.
    zh: "我正在建设一所网络大学，在 AI 辅助下亲自为 100 门课程编写教材、制作课件。未来计划将平台部署到区块链上，为学习者颁发学习证书。"
  - name_en: "Movies & Games"
    name_zh: "电影与游戏"
    en: 'Avid cinephile with 1,000+ films and TV series watched; see [my Douban profile](https://www.douban.com/people/dbzjy). I also enjoy real-time strategy games.'
    zh: '资深影迷，观影量逾 1000 部电影与电视剧；详见[我的豆瓣主页](https://www.douban.com/people/dbzjy)。同时喜欢即时战略游戏。'
