hero:
  name_en: "Jiayi Zhou"
  name_zh: "周家屹"
  subtitle_en: "Ph.D. Candidate · UCAS / CASISD · Beijing"
  subtitle_zh: "博士研究生 · 中国科学院大学 / 中科院科技战略咨询研究院 · 北京"
  keywords:
    - en: "Money View"
      zh: "货币视角"
    - en: "Crypto Assets"
      zh: "加密资产"
    - en: "Biophysical Economics"
      zh: "生物物理经济学"
    - en: "ML & Causal Inference"
      zh: "机器学习与因果推断"

about:
  paragraphs:
    - en: >-
        I am a Ph.D. candidate at the Institutes of Science and Development,
        Chinese Academy of Sciences (CASISD), affiliated with the School of
        Public Policy and Management, University of Chinese Academy of Sciences
        (UCAS). My supervisor is [Prof. Jian-Feng Guo](https://people.ucas.ac.cn/~Guojf).
      zh: >-
        我是中国科学院科技战略咨询研究院（CASISD）的博士研究生，
        就读于中国科学院大学公共政策与管理学院，
        导师为[郭剑锋研究员](https://people.ucas.ac.cn/~Guojf)。
    - en: >-
        My research focuses on **crypto finance and stablecoin economics**,
        spanning decentralized finance (DeFi), systemic risk and financial
        stability, international financial markets, and machine learning /
        causal inference in finance. My doctoral dissertation examines the
        impact of USD stablecoins on international financial markets through
        a multi-method empirical framework.
      zh: >-
        我的研究聚焦**加密金融与稳定币经济学**，涵盖去中心化金融（DeFi）、
        系统性风险与金融稳定、国际金融市场，以及金融中的机器学习与因果推断。
        我的博士论文通过多方法实证框架，系统考察美元稳定币对国际金融市场的影响。
    - en: >-
        A Bitcoiner at heart, I stay active in the Chinese-speaking crypto
        community and keep close track of Bitcoin and the broader digital-asset
        ecosystem.
      zh: >-
        我是一名 Bitcoiner，积极参与华语加密社区，持续关注比特币及更广泛的
        数字资产生态。

philosophy:
  cards:
    - title_en: "First Principles"
      title_zh: "第一性原理"
      en: >-
        I start with fundamental elements, relationships, and constraints,
        reasoning from these foundations to understand how complex phenomena
        arise and how systems operate, and to build explanatory frameworks.
      zh: >-
        我倾向于从事物最基本的构成、关系与约束出发，逐层推演复杂现象的形成与运行逻辑，并在此基础上构建解释框架。

    - title_en: "AI-Augmented Research"
      title_zh: "AI 增强科研"
      en: >-
        I use AI to explore ideas and make research more efficient, while
        maintaining independent judgment and responsibility for my conclusions.
      zh: >-
        我把 AI 作为拓展思路、提高研究效率的伙伴，同时保持独立判断，对研究结论负责。

    - title_en: "Causal Inference"
      title_zh: "因果推断"
      en: >-
        I seek to understand why things happen and how effects propagate,
        testing explanations against credible evidence and carefully
        distinguishing causation from correlation.
      zh: >-
        我希望理解现象为何发生、变化如何传导，用可信的证据检验解释，谨慎区分相关性与因果关系。

    - title_en: "Reproducibility & Open Source"
      title_zh: "可复现性与开源"
      en: >-
        I value transparency and reproducibility in research. By sharing work
        openly, I hope to make knowledge easier to verify, build on, and reuse.
      zh: >-
        我重视研究过程的透明与可复现，并通过开放分享，让知识能够被检验、积累与复用。

    - title_en: "ISFC & the Money View"
      title_zh: "ISFC 与货币视角"
      en: >-
        I understand finance through balance sheets and monetary relationships,
        focusing on connections among participants and the institutions that
        shape the flow of funds.
      zh: >-
        我从资产负债表与货币关系理解金融体系，关注不同主体之间的联系，以及资金流动背后的制度逻辑。

    - title_en: "New Economic Thinking"
      title_zh: "新的经济学思想"
      en: >-
        I draw on different economic traditions and other disciplines to study
        how energy, money, and power interact to shape economic activity.
      zh: >-
        我对不同经济学传统与跨学科视角保持开放，尤其关注能源、货币与权力如何相互作用，共同塑造经济活动。

  quote:
    zh_text: "科学，就是相信专家也会无知。"
    zh_source: "理查德·费曼"
    en_text: "Science is the belief in the ignorance of experts."
    en_source: "Richard Feynman"

